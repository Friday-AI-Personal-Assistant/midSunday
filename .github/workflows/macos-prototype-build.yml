name: macOS prototype build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: midsunday-macos-prototype
  cancel-in-progress: true

jobs:
  build:
    name: Build macOS desktop prototype
    runs-on: macos-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Show toolchain versions
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version

      - name: Install frontend dependencies
        working-directory: prototype/desktop-shell
        run: npm install --no-audit --no-fund

      - name: Build frontend
        working-directory: prototype/desktop-shell
        run: npm run build

      - name: Build macOS disk image
        working-directory: prototype/desktop-shell
        run: npx tauri build --bundles dmg

      - name: Upload build outputs and generated lockfile (manual runs only)
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: midsunday-macos-prototype-build
          path: |
            prototype/desktop-shell/src-tauri/target/release/bundle/dmg/*.dmg
            prototype/desktop-shell/package-lock.json
          if-no-files-found: warn
          retention-days: 7
