name: midSunday Desktop Builds

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: midsunday-desktop-builds
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows — Build installer
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install Rust (MSVC)
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "rustup-init.exe"
          Invoke-WebRequest "https://win.rustup.rs/x86_64" -OutFile $installer
          & $installer -y --profile minimal --default-host x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "Rust installation failed." }
          ($env:USERPROFILE + '\.cargo\bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Show toolchain versions
        shell: pwsh
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version

      - name: Install frontend dependencies
        working-directory: prototype/desktop-shell
        run: npm install --no-audit --no-fund

      - name: Build frontend
        working-directory: prototype/desktop-shell
        run: npm run build

      - name: Build Windows installer
        working-directory: prototype/desktop-shell
        run: npx tauri build

      - name: Upload Windows installer and generated lockfile (manual runs only)
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: midsunday-windows-build
          path: |
            prototype/desktop-shell/src-tauri/target/release/bundle/nsis/*.exe
            prototype/desktop-shell/package-lock.json
          if-no-files-found: warn
          retention-days: 7

  build-linux:
    name: Linux — Build packages
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            librsvg2-dev \
            patchelf \
            libwebkit2gtk-4.1-dev

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Show toolchain versions
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version

      - name: Install frontend dependencies
        working-directory: prototype/desktop-shell
        run: npm install --no-audit --no-fund

      - name: Build frontend
        working-directory: prototype/desktop-shell
        run: npm run build

      - name: Build Linux packages
        working-directory: prototype/desktop-shell
        run: npx tauri build --bundles appimage,deb

      - name: Upload Linux packages and generated lockfile (manual runs only)
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: midsunday-linux-build
          path: |
            prototype/desktop-shell/src-tauri/target/release/bundle/appimage/*.AppImage
            prototype/desktop-shell/src-tauri/target/release/bundle/deb/*.deb
            prototype/desktop-shell/package-lock.json
          if-no-files-found: warn
          retention-days: 7

  build-macos:
    name: macOS — Build disk image
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Show toolchain versions
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version

      - name: Install frontend dependencies
        working-directory: prototype/desktop-shell
        run: npm install --no-audit --no-fund

      - name: Build frontend
        working-directory: prototype/desktop-shell
        run: npm run build

      - name: Build macOS disk image
        working-directory: prototype/desktop-shell
        run: npx tauri build --bundles dmg

      - name: Upload macOS disk image and generated lockfile (manual runs only)
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: midsunday-macos-build
          path: |
            prototype/desktop-shell/src-tauri/target/release/bundle/dmg/*.dmg
            prototype/desktop-shell/package-lock.json
          if-no-files-found: warn
          retention-days: 7
