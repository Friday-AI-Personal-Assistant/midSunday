name: Windows prototype build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: midsunday-windows-prototype
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows desktop prototype
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install Rust (MSVC)
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "rustup-init.exe"
          Invoke-WebRequest "https://win.rustup.rs/x86_64" -OutFile $installer
          & $installer -y --profile minimal --default-host x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "Rust installation failed." }
          "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Show toolchain versions
        shell: pwsh
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version

      - name: Install frontend dependencies
        working-directory: prototype/desktop-shell
        run: npm install --no-audit --no-fund

      - name: Build frontend
        working-directory: prototype/desktop-shell
        run: npm run build

      - name: Build Windows installer
        working-directory: prototype/desktop-shell
        run: npx tauri build

      - name: Upload NSIS installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: midsunday-windows-prototype-installer
          path: prototype/desktop-shell/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
