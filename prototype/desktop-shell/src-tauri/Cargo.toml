[package]
name = "midsunday"
version = "0.1.0"
description = "midSunday AI Personal Companion desktop shell"
authors = ["midSunday contributors"]
edition = "2021"

[lib]
name = "midsunday_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
tempfile = "3"
ureq = { version = "3.5.2", default-features = false, features = ["json"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
sysinfo = "0.37"
starship-battery = "0.12"

[target.'cfg(target_os = "linux")'.dependencies]
nvml-wrapper = "0.13"

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.32"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Graphics_Dxgi"] }
