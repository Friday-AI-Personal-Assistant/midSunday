[package]
name = "midsunday"
version = "0.1.0"
description = "midSunday AI Personal Companion desktop shell"
authors = ["midSunday contributors"]
edition = "2021"

[lib]
name = "midsunday_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2" }
